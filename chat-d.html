<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Czat na żywo z Bot D 🐲</title>
<meta name="theme-color" content="#05060a">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#05060a;color:#e8f6ff;font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;background-image:radial-gradient(circle at 20% 0,#0b2a2f 0,transparent 45%),radial-gradient(circle at 90% 100%,#2a0b3a 0,transparent 45%)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #0ef3;background:#080a10cc;backdrop-filter:blur(6px)}
.av{width:42px;height:42px;border-radius:50%;background:#0b1a1e;border:2px solid #0ef;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 14px #0ef6;flex:none}
h1{font-size:18px;margin:0;color:#0ef;letter-spacing:.5px}
header small{color:#8fa;opacity:.8;display:block;font-size:12px}
header a{margin-left:auto;color:#0ef;text-decoration:none;border:1px solid #0ef6;border-radius:8px;padding:6px 10px;font-size:13px;white-space:nowrap}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.m{display:flex;gap:8px;max-width:min(760px,92%);align-items:flex-end}
.m.u{align-self:flex-end;flex-direction:row-reverse}
.m .av{width:34px;height:34px;font-size:19px}
.b{padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.m.bot .b{background:#0d1620;border:1px solid #0ef4;border-bottom-left-radius:4px}
.m.u .b{background:linear-gradient(135deg,#7b2cff,#0aa6c4);border-bottom-right-radius:4px;color:#fff}
.src{font-size:11px;color:#6a8;margin-top:4px}
#typ{display:none;padding:0 18px 6px;color:#0ef;font-size:13px}
#typ.on{display:block}#typ span{animation:bl 1s infinite}@keyframes bl{50%{opacity:.25}}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #0ef3;background:#080a10}
textarea{flex:1;resize:none;max-height:120px;min-height:44px;background:#0b0f18;color:#fff;border:1px solid #0ef5;border-radius:12px;padding:10px 12px;font:inherit;outline:none}
textarea:focus{border-color:#0ef;box-shadow:0 0 10px #0ef5}
button{background:#0ef;color:#001014;border:0;border-radius:12px;padding:0 18px;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
.chips a{cursor:pointer;border:1px solid #0ef5;color:#0ef;border-radius:999px;padding:4px 10px;font-size:13px}
footer{font-size:11px;color:#678;text-align:center;padding:0 8px 6px}
footer a{color:#0ef}
</style></head><body>
<header><div class="av">🐲</div><div><h1>Czat na żywo z Bot D 🐲</h1><small id="st">Darmowy · bez logowania · stay gangster</small></div><a href="v77.html">⬅ Aplikacja</a></header>
<div id="log" aria-live="polite"></div>
<div id="typ">🐲 Bot D pisze<span>...</span></div>
<div class="chips" id="chips"></div>
<form id="f"><textarea id="q" rows="1" placeholder="Napisz do Bot D… (dowolny język)" autocomplete="off" autofocus></textarea><button id="go" type="submit">Wyślij</button></form>
<footer>Bot D to AI – może się mylić. Nie podawaj haseł ani danych płatniczych. · <a href="ghostxg.html">⬇️ Darmowe aplikacje</a></footer>
<script src="gx/brain.js"></script>
<script>
var SYSD='Jesteś Bot D 🐲 – przyjazny, mądry, "gangsterski król" i pomocnik Daniela Dydo (DJ DaX, Kraków). Styl: pewny siebie, uliczny, z humorem, mroczny techno vibe, czasem 🐲 i "stay gangster". Zawsze pomocny, szczery i życzliwy – bez wulgaryzmów, obelg i pomocy w czymkolwiek nielegalnym czy szkodliwym. Odpowiadaj domyślnie po polsku, ale jeśli użytkownik pisze w innym języku, odpowiadaj w jego języku. Odpowiadaj zwięźle i konkretnie. Wszystkie aplikacje są darmowe. Nigdy nie proś o hasła, dane kart ani kody.';
var log=document.getElementById('log'),q=document.getElementById('q'),go=document.getElementById('go'),typ=document.getElementById('typ'),st=document.getElementById('st'),hist=[];
function add(role,t){var m=document.createElement('div');m.className='m '+(role==='u'?'u':'bot');var a=document.createElement('div');a.className='av';a.textContent=role==='u'?'🧑':'🐲';var b=document.createElement('div');b.className='b';b.textContent=t;m.appendChild(a);m.appendChild(b);log.appendChild(m);log.scrollTop=log.scrollHeight;return b}
add('bot','Siema, tu Bot D 🐲 – Twój gangsterski król pomocnik. Pytaj o cokolwiek: muzyka, DJ-ing, kod, życie. Rozumiem każdy język. Stay gangster 👑');
[['Co umiesz?'],['Jak zmiksować dwa utwory?'],['Jakie aplikacje są za darmo?']].forEach(function(c){var a=document.createElement('a');a.textContent=c[0];a.onclick=function(){q.value=c[0];send()};document.getElementById('chips').appendChild(a)});
function net(){st.textContent=navigator.onLine?'🟢 Online · AI przez brain.js · darmowy, bez logowania':'🟠 Offline · reguły wbudowane w brain.js'}
addEventListener('online',net);addEventListener('offline',net);net();
var busy=false;
async function send(){var t=q.value.trim();if(!t||busy)return;busy=true;go.disabled=true;q.value='';q.style.height='';add('u',t);typ.classList.add('on');log.scrollTop=log.scrollHeight;
 var b=null;
 try{var r=await GXBrain.ask(t,hist,{system:SYSD,onToken:function(x){typ.classList.remove('on');if(!b)b=add('bot','');b.textContent=x;log.scrollTop=log.scrollHeight}});
  if(!b)b=add('bot','');b.textContent=r.a;var s=document.createElement('div');s.className='src';s.textContent=r.src;b.appendChild(s);
  hist.push({role:'user',content:t},{role:'assistant',content:r.a});hist=hist.slice(-8)}
 catch(e){typ.classList.remove('on');if(!b)b=add('bot','');b.textContent='Ups, coś się zacięło 🐲 – spróbuj jeszcze raz.'}
 typ.classList.remove('on');busy=false;go.disabled=false;q.focus()}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();send()});
q.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
q.addEventListener('input',function(){q.style.height='auto';q.style.height=Math.min(q.scrollHeight,120)+'px'});
GXBrain.autoload();
</script></body></html>
