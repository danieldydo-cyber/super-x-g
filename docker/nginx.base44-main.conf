# Base44 sandbox main config (mounted over /etc/nginx/nginx.conf by docker-compose.base44.yml).
#
# Why a full nginx.conf: the sandbox checkout sits on a root-owned 0700 directory,
# so the default unprivileged `nginx` worker user cannot traverse it. Running the
# workers as root is acceptable here because this service only ever serves static
# files read-only from the bind-mounted working tree in the dev sandbox.
user root;

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;

  sendfile on;
  keepalive_timeout 65;

  include /etc/nginx/conf.d/*.conf;
}
