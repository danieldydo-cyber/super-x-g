# Base44 sandbox config: serve this static site from the bind-mounted working tree.
# Used only by docker-compose.base44.yml (the repo has no server config of its own).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # This repo has no server-side /api implementation (it is built to be hosted
  # statically). js/d7-token.js already answers /api/* with this exact offline
  # payload when the site is served from github.io; mirror that here so panels
  # degrade gracefully instead of receiving nginx 404 HTML.
  location /api/ {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"ok":false,"offline":true,"static":true,"bots":[],"items":[],"tracks":[],"answer":""}';
  }

  # Always revalidate the app shell and service worker while developing.
  location = /sw.js {
    add_header Cache-Control "no-store";
  }
  location = /sxg-sw.js {
    add_header Cache-Control "no-store";
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
