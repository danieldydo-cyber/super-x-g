<!doctype html><html lang="pl"><head><title>🐲 Loop Timer – DJ DaX</title><meta name="description" content="Kalkulator długości pętli (BPM + takty) i metronom z klikiem Web Audio. DJ DaX 🐲">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05030c"><link rel="icon" href="gx/icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:radial-gradient(circle at 50% 0,#2a0b5e,#05030c 60%) fixed;color:#eee;padding:14px;min-height:100vh}main{max-width:720px;margin:auto}
h1{text-align:center;margin:8px 0 4px;background:linear-gradient(90deg,#b388ff,#00e5ff);-webkit-background-clip:text;background-clip:text;color:transparent}h2{color:#00e5ff;font-size:18px}
.sub{text-align:center;opacity:.8;margin:0 0 14px;font-size:14px}.card{background:#140b2a;border:1px solid #3a1f73;border-radius:16px;padding:14px;margin:12px 0}
button,.btn{background:#6b21ff;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;text-decoration:none;display:inline-block;cursor:pointer;margin:3px 0}button:hover,.btn:hover{background:#8a4dff}button.alt{background:#1b1035;border:1px solid #6b21ff}
input,select{background:#0c0620;color:#fff;border:1px solid #3a1f73;border-radius:10px;padding:10px;font-size:15px;width:100%}label{font-size:12px;opacity:.8;display:block;margin-bottom:3px}
.big{font:900 64px/1 monospace;color:#00e5ff;text-shadow:0 0 18px #00e5ff88;text-align:center}.mono{font-family:monospace}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px;border-bottom:1px solid #2a1650;text-align:left}th{color:#b388ff}tr.hit td{background:#00e5ff22;color:#00e5ff}
.nav{text-align:center;font-size:13px;margin-top:16px}.nav a{color:#0ef;margin:0 6px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:100px}
</style>
<style>#pulse{width:150px;height:150px;border-radius:50%;margin:10px auto;background:radial-gradient(circle,#00e5ff,#6b21ff 70%);opacity:.25;transition:opacity .25s,transform .25s;box-shadow:0 0 30px #00e5ff55}#pulse.on{opacity:1;transform:scale(1.12);transition:none}#pulse.acc{background:radial-gradient(circle,#ff2bd6,#6b21ff 70%)}
.dots{text-align:center;font-size:22px;letter-spacing:6px}.dots .d{opacity:.3}.dots .d.on{opacity:1;color:#00e5ff}</style></head><body><main>
<h1>🐲 Loop Timer / Beat Clock</h1><p class="sub">Wpisz BPM i liczbę taktów – dostajesz dokładny czas pętli.</p>
<div class="card"><div class="row"><div><label>BPM</label><input id="bpm" type="number" min="20" max="300" step="0.01" value="128"></div>
<div><label>Takty (bars)</label><input id="bars" type="number" min="0.25" max="64" step="0.25" value="4"></div>
<div><label>Metrum (beaty/takt)</label><select id="sig"><option>4</option><option>3</option><option>2</option><option>5</option><option>6</option><option>7</option></select></div></div>
<div class="big" id="len">--</div><p class="sub">długość pętli: <span class="mono" id="lms">--</span> ms · beat = <span class="mono" id="bms">--</span> ms · takt = <span class="mono" id="barms">--</span> ms</p>
<div class="row" id="presets"></div></div>
<div class="card"><div id="pulse"></div><div class="dots" id="dots"></div>
<p class="sub">Beat: <b id="cnt">-</b> · Takt: <b id="bcnt">-</b> / <span id="btot">4</span></p>
<div class="row"><button id="go">▶ Start</button><label style="flex:1;align-self:center">Głośność kliku<input id="vol" type="range" min="0" max="1" step="0.05" value="0.6"></label></div></div>
<div class="card"><h2>Czasy pętli (przy tym BPM)</h2><table id="tb"><tr><th>Takty</th><th>Sekundy</th></tr></table></div>
<p class="nav"><a href="bpm.html">👆 BPM Tapper</a><a href="setlist.html">📋 Setlist</a><a href="shop.html">🛒 Sklep</a></p></main>
<script>
var $=function(i){return document.getElementById(i)},ac=null,run=false,timer=null,nextT=0,beat=0,q=[];
function P(){var b=parseFloat($('bpm').value),n=parseFloat($('bars').value),s=parseInt($('sig').value);return{b:b,n:n,s:s,ok:b>=20&&b<=300&&n>0}}
function calc(){var p=P();$('btot').textContent=p.s;if(!p.ok){$('len').textContent='--';return}
var bm=60000/p.b,l=bm*p.s*p.n;$('len').textContent=(l/1000).toFixed(3)+' s';$('lms').textContent=l.toFixed(1);$('bms').textContent=bm.toFixed(1);$('barms').textContent=(bm*p.s).toFixed(1);
var tb=$('tb');while(tb.rows.length>1)tb.deleteRow(1);[0.25,0.5,1,2,4,8,16,32].forEach(function(x){var r=tb.insertRow();r.insertCell().textContent=x;r.insertCell().textContent=(bm*p.s*x/1000).toFixed(3)+' s'})
var d=$('dots');if(d.children.length!==p.s){d.innerHTML='';for(var i=0;i<p.s;i++){var e=document.createElement('span');e.className='d';e.textContent='●';d.appendChild(e)}}}
var pr=$('presets');[[90,4],[120,4],[128,8],[140,16],[174,8]].forEach(function(x){var b=document.createElement('button');b.className='alt';b.textContent=x[0]+' / '+x[1];b.onclick=function(){$('bpm').value=x[0];$('bars').value=x[1];calc()};pr.appendChild(b)});
['bpm','bars','sig'].forEach(function(i){$(i).addEventListener('input',calc)});
function click(t,acc){var o=ac.createOscillator(),g=ac.createGain(),v=parseFloat($('vol').value);o.frequency.value=acc?1500:1000;o.type='square';g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*.5,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+.06);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.07)}
function sched(){var p=P();if(!p.ok)return;var bm=60/p.b;while(nextT<ac.currentTime+.15){var acc=beat%p.s===0;click(nextT,acc);q.push({t:nextT,i:beat%p.s,bar:Math.floor(beat/p.s)%Math.max(1,Math.round(p.n))+1,acc:acc});nextT+=bm;beat++}}
function draw(){if(!run)return;while(q.length&&q[0].t<=ac.currentTime){var e=q.shift(),pu=$('pulse');pu.className='on'+(e.acc?' acc':'');setTimeout(function(){pu.className=''},110);
$('cnt').textContent=e.i+1;$('bcnt').textContent=e.bar;var ds=$('dots').children;for(var i=0;i<ds.length;i++)ds[i].className='d'+(i===e.i?' on':'')}requestAnimationFrame(draw)}
$('go').onclick=function(){if(run){run=false;clearInterval(timer);$('go').textContent='▶ Start';q=[];return}
if(!P().ok){alert('Podaj BPM 20–300 i takty > 0');return}
ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.resume)ac.resume();run=true;beat=0;q=[];nextT=ac.currentTime+.08;timer=setInterval(sched,25);sched();$('go').textContent='■ Stop';requestAnimationFrame(draw)};
calc();
</script></body></html>
