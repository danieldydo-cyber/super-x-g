<!doctype html><html lang="pl"><head><script src="js/d7-token.js?v=1065"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🎚 WeDJ PRO · Super X G 🐲</title><meta name="theme-color" content="#0b0b12">
<style>
*{box-sizing:border-box}body{margin:0;background:#07070d;color:#e8e8f0;font:13px system-ui;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#top{display:flex;gap:6px;align-items:center;padding:6px 8px;background:#101018;border-bottom:1px solid #2a2a40;flex-wrap:wrap}#top b{color:#00e5ff;font-size:15px}
button,select{background:#1a1a2a;color:#eee;border:1px solid #33335a;border-radius:8px;padding:6px 9px;font:inherit;cursor:pointer;touch-action:manipulation}button.on{background:#00b8d4;color:#000;border-color:#00e5ff}button:active{filter:brightness(1.4)}
#app{display:grid;grid-template-columns:1fr 190px 1fr;gap:6px;padding:6px;height:calc(100vh - 196px);min-height:460px}#xf{width:100%!important}#top{padding-right:48px}.mixer input[type=range]{width:100px!important}
.deck{background:#0e0e18;border:1px solid #23233a;border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:5px;min-width:0}
.deck h3{margin:0;font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}.deck h3 span{color:#ffb300}.deckB h3 span{color:#ff4081}
canvas.wf{width:100%;height:70px;background:#000;border-radius:6px;display:block}canvas.ov{width:100%;height:18px;background:#000;border-radius:4px;display:block}
.mid{display:flex;gap:6px;align-items:center;justify-content:center;flex:1;min-height:0}
.jog{width:min(30vh,42%);aspect-ratio:1;border-radius:50%;background:radial-gradient(#222 0 30%,#111 31% 60%,#1c1c2c 61%);border:3px solid #333;position:relative;touch-action:none;flex:none}
.jog i{position:absolute;left:50%;top:4%;width:4px;height:18%;background:#00e5ff;margin-left:-2px;border-radius:2px;transform-origin:2px 245%}
.deckB .jog i{background:#ff4081}
.pitch{writing-mode:vertical-lr;direction:rtl;height:min(30vh,200px);width:28px}
.row{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.row button{flex:1;min-width:38px}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.pads button{height:34px}.hc.set{background:#5a3b00}.deckB .hc.set{background:#5a0030}
.mixer{background:#0e0e18;border:1px solid #23233a;border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:stretch;overflow:auto}
.mixer label{font-size:11px;color:#aab;display:flex;justify-content:space-between;align-items:center;gap:4px}.mixer input[type=range]{width:72px}
#xf{width:100%}.small{font-size:11px;color:#99a}.bpm{font:bold 18px monospace;color:#fff}
#sampler{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:0 6px 6px}#sampler button{height:40px;font-size:11px}
#fxbar{display:flex;gap:4px;flex-wrap:wrap;padding:0 6px 6px}
@media (max-width:820px){#app{grid-template-columns:1fr;height:auto}.mixer{order:3}#sampler{grid-template-columns:repeat(4,1fr)}.jog{width:40vw}}
</style></head><body>
<div id="top"><b>🎚 WeDJ PRO</b><span class="small">2 decki · sync · EQ · FX · sampler · auto-mix · Super X G 🐲</span><span style="flex:1"></span>
<button id="aimix">🤖 Auto-mix</button><button id="aifx">✨ AI FX</button><button id="fs">⛶</button></div>
<div id="app">
 <div class="deck deckA" id="dA"></div>
 <div class="mixer" id="mx">
  <div class="row"><span class="small">Master</span><input id="mvol" type="range" min="0" max="1" step=".01" value=".85"></div>
  <div id="mxA"></div><div id="mxB"></div>
  <span class="small">Crossfader</span><input id="xf" type="range" min="-1" max="1" step=".01" value="0">
  <canvas id="vu" style="width:100%;height:40px;background:#000;border-radius:6px"></canvas>
  <span class="small" id="stat">gotowe</span>
 </div>
 <div class="deck deckB" id="dB"></div>
</div>
<div id="fxbar"></div>
<div id="sampler"></div>
<script src="js/wedj.js?v=1090"></script><script src="js/wedj-pro.js?v=1090"></script></body></html>
